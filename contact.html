<head>
    <meta charset="UTF-8">

        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/GabbyFashionInpo_Banner_Logo-removebg-preview.png" alt="Gabby Fashion Inspo Logo"
                        class="header-logo-img">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="social-icons">
                <a href="mailto:gabriela.gregoris1818@gmail.com"><i class="fa-regular fa-envelope"></i></a>
                <a href="https://www.instagram.com/gabby_fashioninspo/"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@gabby_fashioninspo"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.youtube.com/@gabby_fashioninspo/shorts"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://ca.pinterest.com/gabby_fashioninspo/"><i class="fa-brands fa-pinterest"></i></a>
            </div>
        </div>
    </header>

    <!-- Contact Section -->
    <section class="contact-page">
        <div class="container contact-container">

            <!-- Contact Hero Image -->
            <div class="contact-hero-image">
                <img src="https://placehold.co/1000x300/e0e0e0/333333?text=Contact+Banner" alt="Contact Banner">
            </div>

            <div class="contact-header">
                <h1 class="script-font">Contact Me</h1>
            </div>

            <!-- Contact Form Wrapper -->
            <div class="contact-form-wrapper">
                <form class="contact-form" action="#" method="POST">

                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>

                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder="Subject" required>
                    </div>

                    <div class="form-group">
                        <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-submit">Send Message</button>

                </form>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-container">
            <div class="footer-brand">
                <a href="index.html">
                    <img src="assets/GabbyFashionInpo_Banner_Logo-removebg-preview.png" alt="Gabby Fashion Inspo Logo"
                        class="header-logo-img">
                </a>
            </div>
            <div class="footer-links">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="privacy.html">Privacy Policy</a></li>
                </ul>
            </div>
            <div class="footer-connect">
                <h4>Connect</h4>
                <div class="social-icons">
                    <a href="mailto:gabriela.gregoris1818@gmail.com"><i class="fa-regular fa-envelope"></i></a>
                    <a href="https://www.instagram.com/gabby_fashioninspo/"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.tiktok.com/@gabby_fashioninspo"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="https://www.youtube.com/@gabby_fashioninspo/shorts"><i
                            class="fa-brands fa-youtube"></i></a>
                    <a href="https://ca.pinterest.com/gabby_fashioninspo/"><i class="fa-brands fa-pinterest"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2026 Gabby Fashion Inspo. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
